<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Minimal piFM RF path</title>
  <desc id="desc">GPIO 4 connects through an appropriate low-pass filter to an antenna or test load.</desc>
  <rect width="900" height="300" fill="#0c0d10"/>
  <text x="40" y="45" fill="#e0b060" font-family="sans-serif" font-size="24">MINIMAL RF PATH</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="45" y="95" width="180" height="90" rx="6" fill="#1b2030" stroke="#5ecf8a" stroke-width="3"/>
    <text x="135" y="130" fill="#e8e4d8" font-size="18">Raspberry Pi</text>
    <text x="135" y="158" fill="#e0b060" font-size="16">GPIO 4  |  pin 7</text>
    <rect x="355" y="95" width="190" height="90" rx="6" fill="#1b2030" stroke="#e0b060" stroke-width="3"/>
    <text x="450" y="130" fill="#e8e4d8" font-size="18">Low-pass filter</text>
    <text x="450" y="158" fill="#9aa3b5" font-size="14">Required RF engineering</text>
    <rect x="675" y="95" width="180" height="90" rx="6" fill="#1b2030" stroke="#58647a" stroke-width="3"/>
    <text x="765" y="130" fill="#e8e4d8" font-size="18">Antenna / load</text>
    <text x="765" y="158" fill="#9aa3b5" font-size="14">Locally appropriate</text>
  </g>
  <path d="M225 140H355M545 140H675" stroke="#e8e4d8" stroke-width="4"/>
  <path d="M335 132L355 140L335 148M655 132L675 140L655 148" fill="none" stroke="#e8e4d8" stroke-width="4"/>
  <text x="45" y="238" fill="#c44b4b" font-family="sans-serif" font-size="15">UNVERIFIED BY SOFTWARE: filter design, antenna, emissions, range, and legal authorization.</text>
  <text x="45" y="266" fill="#9aa3b5" font-family="sans-serif" font-size="14">Physically proven software/hardware reference: Raspberry Pi Model A+ only.</text>
</svg>
