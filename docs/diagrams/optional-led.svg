<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Optional status LED wiring</title>
  <desc id="desc">Header pin 12, BCM 18, drives a status LED through a series resistor to ground. GPIO high is 3.3 V. Never use 5 V. This drawing does not move FM output on header pin 7.</desc>
  <rect width="920" height="520" fill="#0c0d10"/>
  <text x="40" y="48" fill="#e0b060" font-family="sans-serif" font-size="24">OPTIONAL STATUS LED</text>
  <text x="40" y="78" fill="#9aa3b5" font-family="sans-serif" font-size="15">BCM 18  |  header pin 12  |  3.3 V when the lamp is on  |  never 5 V</text>

  <g font-family="sans-serif">
    <rect x="36" y="118" width="190" height="118" rx="8" fill="#1b2030" stroke="#e0b060" stroke-width="3"/>
    <text x="52" y="152" fill="#e0b060" font-size="16">Header pin 12</text>
    <text x="52" y="178" fill="#e8e4d8" font-size="15">BCM 18</text>
    <text x="52" y="204" fill="#9aa3b5" font-size="13">3.3 V GPIO high</text>

    <rect x="286" y="118" width="170" height="118" rx="8" fill="#1b2030" stroke="#e0b060" stroke-width="3"/>
    <text x="302" y="158" fill="#e8e4d8" font-size="16">Series resistor</text>
    <polyline points="318,196 334,176 350,208 366,176 382,208 398,196" fill="none" stroke="#e0b060" stroke-width="3"/>

    <rect x="516" y="118" width="160" height="118" rx="8" fill="#1b2030" stroke="#e8e4d8" stroke-width="3"/>
    <text x="548" y="152" fill="#e8e4d8" font-size="16">Status LED</text>
    <polygon points="560,188 600,208 560,228" fill="none" stroke="#e0b060" stroke-width="3"/>
    <path d="M600 188 V228" fill="none" stroke="#e0b060" stroke-width="3"/>
    <text x="612" y="214" fill="#9aa3b5" font-size="12">anode at pin</text>

    <rect x="736" y="118" width="148" height="118" rx="8" fill="#1b2030" stroke="#5ecf8a" stroke-width="3"/>
    <text x="770" y="168" fill="#5ecf8a" font-size="16">Ground</text>
    <text x="754" y="196" fill="#9aa3b5" font-size="13">any GND pin</text>
  </g>

  <path d="M226 176 H286 M456 176 H516 M676 176 H736" stroke="#e8e4d8" stroke-width="4"/>
  <path d="M270 168 L286 176 L270 184 M500 168 L516 176 L500 184 M720 168 L736 176 L720 184" fill="none" stroke="#e8e4d8" stroke-width="3"/>

  <text x="40" y="292" fill="#e8e4d8" font-family="sans-serif" font-size="16">Pin 12 → series resistor → LED → ground</text>
  <text x="40" y="324" fill="#9aa3b5" font-family="sans-serif" font-size="15">The lamp is steady only while a transmitter is running.</text>
  <text x="40" y="350" fill="#9aa3b5" font-family="sans-serif" font-size="15">OFF and READY stay dark. FAULT blinks. ON AIR with no transmitter stays dark.</text>
  <text x="40" y="390" fill="#c44b4b" font-family="sans-serif" font-size="15">Never use 5 V for this GPIO. This is not Raspberry Pi supply wiring.</text>
  <text x="40" y="424" fill="#e0b060" font-family="sans-serif" font-size="15">FM output stays header pin 7 / BCM 4. This drawing does not move it.</text>
  <text x="40" y="470" fill="#9aa3b5" font-family="sans-serif" font-size="14">LED only. The shutdown switch is a separate optional circuit.</text>
</svg>
